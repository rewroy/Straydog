[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/rewroy/Straydog"

[profile.release]
lto = "thin"
codegen-units = 1

# Hashing and decoding are unusable unoptimized: dependencies are optimized in every profile.
[profile.dev.package."*"]
opt-level = 3
