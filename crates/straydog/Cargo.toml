[package]
name = "straydog"
description = "A local inference engine for Qwen3.8-Flash-Next with an OpenAI-compatible server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "straydog"
path = "src/main.rs"
required-features = ["gpu"]

[[test]]
name = "runtime_gpu"
harness = false
required-features = ["gpu"]

[[test]]
name = "runtime_controls"
harness = false

[features]
# The GPU backend linked into the executable.
# `gpu` is how the binary and runtime_gpu require one of them.
# Provision's quantizer follows its own hip/cuda feature, so the executable turns that on too.
hip = ["straydog-engine/hip", "straydog-provision/hip", "gpu"]
cuda = ["straydog-engine/cuda", "straydog-provision/cuda", "nvml", "gpu"]
gpu = []
# NVIDIA telemetry for the dashboard through the driver's NVML, loaded at run time.
nvml = ["dep:nvml-wrapper"]

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
nvml-wrapper = { version = "0.13.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
straydog-api = { path = "../straydog-api" }
straydog-engine = { path = "../straydog-engine" }
# Linked directly so the build script learns where the GPU runtime lives (rpath).
straydog-gpu = { path = "../straydog-gpu" }
straydog-isolation = { path = "../straydog-isolation" }
straydog-provision = { path = "../straydog-provision" }
sysinfo = { version = "0.39.6", default-features = false, features = ["component", "disk", "system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The system block's state sealed on the drive (Windows alone): AES-256-GCM, whose key DPAPI keeps.
[target.'cfg(windows)'.dependencies]
ring = "0.17"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
http-body-util = "0.1"
straydog-provision = { path = "../straydog-provision", features = ["mock"] }
# Tests read floats back from the server's JSON (the dashboard's sample times, which a test then
# sends as its cursor): without float_roundtrip about 1 in 8 parse one ulp off, and a sample the
# test already has comes back as newer. Tests only: the server's own parsing is unchanged.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tower = { version = "0.5", features = ["util"] }
