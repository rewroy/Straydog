[package]
name = "straydog-engine"
description = "The Straydog inference engine: tokenizer, chat template, weights, placement and the generation loop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.3"
indexmap = "2"
memmap2 = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
straydog-gguf = { path = "../straydog-gguf" }
straydog-gpu = { path = "../straydog-gpu" }
minijinja = { version = "2.24", features = ["preserve_order"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
regex = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[features]
# The GPU backend to link (tests that run on a GPU need one).
hip = ["straydog-gpu/hip"]
cuda = ["straydog-gpu/cuda"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
