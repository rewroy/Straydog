[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "straydog"
version = "0.1.0"
description = "A local inference engine for Qwen3.8-Flash-Next with an OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0,<3.0",
    "gguf==0.19.0",
    "jinja2==3.1.6",
    "tokenizers>=0.20",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    # cuBLAS for the packaged Windows/CUDA build (cublas64_12.dll), without the CUDA Toolkit.
    "nvidia-cublas-cu12>=12.8,<13; sys_platform == 'win32'",
]

[project.scripts]
straydog = "straydog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/straydog"]

[tool.hatch.build.targets.sdist]
exclude = [".build", "native/target"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not gpu and not benchmark"]
timeout = 120
asyncio_mode = "auto"
markers = [
    "gpu: tests that need a GPU and an explicit GPU library (run with -m gpu)",
    "benchmark: performance benchmarks (opt-in)",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 120
target-version = "py311"
