[package]
name = "straydog-engine"
description = "The Straydog inference engine: tokenizer, chat template, weights, placement and the generation loop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.3"
indexmap = "2"
memmap2 = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
straydog-gguf = { path = "../straydog-gguf" }
straydog-gpu = { path = "../straydog-gpu" }
minijinja = { version = "2.24", features = ["preserve_order"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
regex = "1"
rayon = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[features]
# The GPU backend to link (tests that run on a GPU need one).
# `gpu` is how a target requires one of them: Cargo's required-features cannot say hip or cuda.
hip = ["straydog-gpu/hip", "gpu"]
cuda = ["straydog-gpu/cuda", "gpu"]
gpu = []

# These examples link the native GPU library. Without hip or cuda, cargo test skips them.
[[example]]
name = "ds41_chat"
required-features = ["gpu"]

[[example]]
name = "ds41_gpu"
required-features = ["gpu"]

[[example]]
name = "ds41_kernels"
required-features = ["gpu"]

[[example]]
name = "ds41_vision"
required-features = ["gpu"]

[[example]]
name = "ds41_quality"
required-features = ["gpu"]

[[example]]
name = "formats_bench"
required-features = ["gpu"]

[[example]]
name = "op_latency"
required-features = ["gpu"]

[[example]]
name = "placement"
required-features = ["gpu"]

[[example]]
name = "prefill"
required-features = ["gpu"]

[[example]]
name = "qwen_tables"
required-features = ["gpu"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
