[package]
name = "straydog-isolation"
description = "Containment of the Straydog GPU worker: bubblewrap on Linux, its own AppContainer on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# The test executable plays the straydog executable (the contained worker, the Windows launcher),
# so it dispatches its own subcommands before running any test.
[[test]]
name = "contained"
harness = false
