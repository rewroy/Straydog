[package]
name = "straydog"
version = "0.1.0"
description = "Straydog: a local inference engine with an OpenAI-compatible server"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "straydog-inspect"
path = "src/main.rs"
