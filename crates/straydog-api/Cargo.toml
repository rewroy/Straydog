[package]
name = "straydog-api"
description = "The OpenAI-compatible HTTP API of the Straydog server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures = "0.3"
getrandom = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
straydog-engine = { path = "../straydog-engine" }
# Only for its link metadata: the tests link the GPU library through the engine.
straydog-gpu = { path = "../straydog-gpu" }
subtle = "2.6"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
